[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaicplayer"
dynamic = ["version"]
description = "Play many videos at once, packed like a puzzle to fill the screen"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "itsui" }]
keywords = ["video", "player", "grid", "mosaic", "video wall", "mpv", "gridplayer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Display",
]
dependencies = ["PySide6==6.8.1", "mpv==1.0.7"]

[project.optional-dependencies]
dev = ["pytest", "pyflakes", "pyinstaller"]

[project.urls]
Homepage = "https://github.com/itsui/mosaicplayer"
Issues = "https://github.com/itsui/mosaicplayer/issues"

[project.gui-scripts]
mosaicplayer = "mosaicplayer.__main__:main"

[tool.setuptools]
packages = ["mosaicplayer"]

[tool.setuptools.package-data]
mosaicplayer = ["icons/*.png"]

[tool.setuptools.dynamic]
version = { attr = "mosaicplayer.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
