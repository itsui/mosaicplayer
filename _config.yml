# GitHub Pages: the README becomes https://itsui.github.io/mosaicplayer/
title: MosaicPlayer
tagline: "Play multiple videos at the same time (Windows, Linux)"
description: >-
  Free multi video player for Windows and Linux. Play dozens of videos at once
  in a video wall that fills the screen, portrait and landscape mixed.
  A fast GridPlayer alternative.
url: "https://itsui.github.io"
baseurl: "/mosaicplayer"
logo: /mosaicplayer/icons/mosaicplayer-256.png
lang: en
author: itsui
theme: jekyll-theme-primer
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - tests
  - packaging
  - "*.sh"
  - pyproject.toml
  - requirements.txt
  - CHANGELOG.md
defaults:
  - scope:
      path: ""
    values:
      image: /docs/screenshot-15-videos.jpg  # preview when the link is shared
