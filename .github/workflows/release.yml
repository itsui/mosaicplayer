name: Release

# Push a version tag (git tag v0.3.0 && git push origin v0.3.0) to build the
# Windows installer, a portable Windows zip and the Linux AppImage, and attach
# them to a GitHub release (created as a draft to review before publishing).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Builds only read the repo; only the final job may create the release.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - name: Download libmpv (shinchiro's mpv builds, pinned and checksummed)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # To update: pick a newer release, download it, put its sha256sum here.
          MPV_RELEASE: "20261019"
          MPV_ASSET: mpv-dev-x86_64-20261019-git-6a262d11f6.7z
          MPV_SHA256: ca8604754170db6f1b23139d8449782b1ae294a883211131954d30085985f77b
        run: |
          gh release download "$MPV_RELEASE" --repo shinchiro/mpv-winbuild-cmake --pattern "$MPV_ASSET" --dir mpv
          echo "$MPV_SHA256  mpv/$MPV_ASSET" | sha256sum -c -
          7z x -ompv "mpv/$MPV_ASSET" libmpv-2.dll
          # A Windows path: Python on Windows can't open /d/a/... style paths.
          echo "LIBMPV_DLL=$(cygpath -w "$PWD/mpv/libmpv-2.dll")" >> "$GITHUB_ENV"
      - run: pyinstaller --noconfirm --clean packaging/mosaicplayer.spec
      - name: Version
        shell: bash
        run: echo "VERSION=$(python -c 'import mosaicplayer; print(mosaicplayer.__version__)')" >> "$GITHUB_ENV"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=$env:VERSION packaging\windows\mosaicplayer.iss
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\MosaicPlayer -DestinationPath "dist\MosaicPlayer-$env:VERSION-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-windows-setup.exe
            dist/*-windows-portable.zip

  linux:
    # The AppImage runs on distros at least as new as the one it is built on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv2 libfuse2t64 file
      - run: pip install . pyinstaller
      - run: bash packaging/linux/build-appimage.sh
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # to create the draft release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
